<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darga 2 Darga - Order Tracking</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
    }

    .order {
      margin-top: 25px;
      padding: 20px;
      background: #f8f8f8;
      border-radius: 14px;
    }

    .row {
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .status {
      display: inline-block;
      background: #28a745;
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
    }

    .error {
      text-align: center;
      color: #c00;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>دەرگا ٢ دەرگا</h1>

  <div id="content"></div>

</div>

<script>

const orders = {

  "DG-0001": {
    name: "کڕیاری یەکەم",
    order: "ئۆردەری ژمارە 0001",
    product: "کاڵای نموونە",
    quantity: "1",
    price: "$100",
    status: "لە ڕێگادایە"
  },

  "DG-0002": {
    name: "کڕیاری دووەم",
    order: "ئۆردەری ژمارە 0002",
    product: "کاڵای نموونە",
    quantity: "2",
    price: "$200",
    status: "ئامادەیە"
  }

};


const params = new URLSearchParams(window.location.search);
const code = params.get("code");

const content = document.getElementById("content");


if (code && orders[code]) {

  const order = orders[code];

  content.innerHTML = `

    <h2>بەخێربێیت ${order.name}</h2>

    <div class="order">

      <div class="row">
        <b>کۆدی ئۆردەر:</b><br>
        ${code}
      </div>

      <div class="row">
        <b>ژمارەی ئۆردەر:</b><br>
        ${order.order}
      </div>

      <div class="row">
        <b>کاڵا:</b><br>
        ${order.product}
      </div>

      <div class="row">
        <b>بڕ:</b><br>
        ${order.quantity}
      </div>

      <div class="row">
        <b>نرخ:</b><br>
        ${order.price}
      </div>

      <div class="row">
        <b>بارودۆخ:</b><br><br>
        <span class="status">${order.status}</span>
      </div>

    </div>

  `;

} else {

  content.innerHTML = `

    <div class="error">

      <h2>کۆدی ئۆردەر هەڵەیە</h2>

      <p>
        تکایە لینکی دروست بەکاربهێنە.
      </p>

    </div>

  `;

}

</script>

</body>
</html>
