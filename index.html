<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARGA2DARGA - بەدواداچوونی داواکاری</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f6fa;
  font-family: Arial, Tahoma, sans-serif;
  color: #202533;
}

.container {
  max-width: 650px;
  margin: 25px auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 28px;
  padding: 28px;
  margin-bottom: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.06);
}

.header {
  text-align: center;
  padding: 25px 20px;
}

.logo {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 1px;
  color: #006b6b;
}

.brand {
  font-size: 17px;
  color: #777;
  margin-top: 5px;
  letter-spacing: 3px;
}

.title {
  font-size: 22px;
  font-weight: bold;
  margin-top: 25px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 17px 0;
  border-bottom: 1px solid #eee;
}

.row:last-child {
  border-bottom: none;
}

.label {
  color: #777;
  font-size: 15px;
}

.value {
  font-size: 19px;
  font-weight: bold;
}

.total {
  background: #f8fafc;
  border-radius: 18px;
  padding: 20px;
  margin-top: 15px;
}

.total .value {
  color: #e33b4b;
  font-size: 26px;
}

.status-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 25px;
}

.step {
  display: flex;
  align-items: center;
  gap: 15px;
  margin: 18px 0;
}

.circle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #eef1f5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #777;
}

.step.active .circle {
  background: #1769e0;
  color: white;
}

.step.done .circle {
  background: #168b58;
  color: white;
}

.step-text {
  font-size: 16px;
}

.step.active .step-text,
.step.done .step-text {
  font-weight: bold;
}

.order {
  text-align: center;
  color: #777;
  margin-top: 10px;
}

@media (max-width: 600px) {
  .container {
    margin: 0 auto;
    padding: 10px;
  }

  .card {
    border-radius: 22px;
    padding: 22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card header">
    <div class="logo">DARGA2DARGA</div>
    <div class="brand">دەرگا 2 دەرگا</div>

    <div class="title">
      📦 بەدواداچوونی داواکاری
    </div>

    <div class="order">
      ژمارەی داواکاری: <strong>#1001</strong>
    </div>
  </div>


  <div class="card">

    <div class="row">
      <div class="label">💰 نرخی کاڵا</div>
      <div class="value">IQD 129,250</div>
    </div>

    <div class="row">
      <div class="label">🚚 کرێی گەیاندن</div>
      <div class="value">IQD 3,000</div>
    </div>

    <div class="row">
      <div class="label">💵 کۆی پارەی داواکاری</div>
      <div class="value">IQD 132,250</div>
    </div>

    <div class="total">
      <div class="row">
        <div class="label">پارەی ماوە</div>
        <div class="value">IQD 132,250</div>
      </div>
    </div>

  </div>


  <div class="card">

    <div class="status-title">
      📍 بەدواداچوونی داواکاری
    </div>

    <div class="step done">
      <div class="circle">✓</div>
      <div class="step-text">گەڕاوە</div>
    </div>

    <div class="step done">
      <div class="circle">✓</div>
      <div class="step-text">دەنێردرێت</div>
    </div>

    <div class="step done">
      <div class="circle">✓</div>
      <div class="step-text">نێردراوە بۆ دووین</div>
    </div>

    <div class="step done">
      <div class="circle">✓</div>
      <div class="step-text">گەیشتووە هەولێر</div>
    </div>

    <div class="step active">
      <div class="circle">5</div>
      <div class="step-text">لە ڕێگادایە / شۆفێر</div>
    </div>

    <div class="step">
      <div class="circle">6</div>
      <div class="step-text">گەیەندراوە</div>
    </div>

  </div>

</div>

</body>
</html>
